<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#9E2A35">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Valodas Taka</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Valodas Taka">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: viena ekrāna lietotne — augšā josla ar sēriju un punktiem, zem tās nodarbību saraksts / uzdevuma kartīte, pogas pie īkšķa apakšā. */
:root{
  --bg:#F4F3F1; --surface:#FFFFFF; --ink:#1D1A1B; --muted:#6B6466; --line:#E2DEDD;
  --accent:#9E2A35;        /* Latvijas karogs: karmīnsarkanais */
  --accent-ink:#FFFFFF;
  --accent-soft:#F3E3E4;
  --ok:#2F6B4F; --ok-soft:#E1EFE7;
  --bad:#B4532A; --bad-soft:#F7E6DC;
  --masc:#1F6FB2;          /* kā plakātos: vīriešu galotnes zilas */
  --fem:#C2185B;           /* sieviešu galotnes rozā */
  --display:"Bricolage Grotesque", "Inter", system-ui, sans-serif;
  --body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161314; --surface:#221E1F; --ink:#F2EEEE; --muted:#A79FA1; --line:#3A3334;
  --accent:#D9505E; --accent-ink:#1A0E10; --accent-soft:#3A2226;
  --ok:#6FC79A; --ok-soft:#1F3328; --bad:#F09466; --bad-soft:#3B2519;
  --masc:#6CB0EE; --fem:#F06A9E; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#161314; --surface:#221E1F; --ink:#F2EEEE; --muted:#A79FA1; --line:#3A3334;
  --accent:#D9505E; --accent-ink:#1A0E10; --accent-soft:#3A2226;
  --ok:#6FC79A; --ok-soft:#1F3328; --bad:#F09466; --bad-soft:#3B2519;
  --masc:#6CB0EE; --fem:#F06A9E; color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:12px 24px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1}

/* Augšējā josla */
.top{display:flex;align-items:center;gap:12px;padding-block:6px 14px}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.01em;flex:1;min-width:0}
.brand .flag{display:inline-block;width:18px;height:12px;vertical-align:1px;margin-right:8px;border-radius:2px;
  background:linear-gradient(var(--accent) 0 40%, var(--surface) 40% 60%, var(--accent) 60%);box-shadow:0 0 0 1px var(--line)}
.stat{display:flex;align-items:center;gap:6px;font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;
  background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 11px}
.stat svg{width:16px;height:16px}
.back{border:0;background:none;padding:6px 8px 6px 0;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:4px}

/* Sākums */
.hello{padding-block:4px 16px}
.hello h1{font-size:30px;font-weight:800;letter-spacing:-.02em}
.hello p{margin:6px 0 0;color:var(--muted)}
.goal{display:flex;align-items:center;gap:12px;margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.goal .bar{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.goal .bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.goal small{color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.section-label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.modules{display:grid;gap:10px}
.mod{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:14px;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.mod:active{transform:scale(.99)}
.mod .glyph{width:52px;height:52px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;
  font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.02em}
.mod h3{font-size:17px;font-weight:700}
.mod p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.mod .ch{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ring{width:38px;height:38px}
.ring circle{fill:none;stroke-width:4}
.ring .t{stroke:var(--line)} .ring .v{stroke:var(--ok);stroke-linecap:round;transition:stroke-dashoffset .5s}
.ring text{font:700 10px var(--body);fill:var(--muted)}
.review{margin-top:10px;width:100%;border:1.5px dashed var(--accent);background:transparent;color:var(--accent);border-radius:14px;padding:12px;font-weight:700}
.review[disabled]{opacity:.45;cursor:default}

/* Teorija */
.theory h2{font-size:26px;font-weight:800;letter-spacing:-.02em}
.theory .lead{color:var(--muted);margin:8px 0 14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.theory .card{margin-bottom:12px}
.theory h4{margin:0 0 8px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.theory p{margin:0 0 8px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
tr:last-child td{border-bottom:0}
.m{color:var(--masc);font-weight:700} .f{color:var(--fem);font-weight:700}
.ex{font-style:italic}
.sticky-cta{position:sticky;bottom:0;padding-block:12px calc(4px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent, var(--bg) 30%)}

/* Uzdevums */
.quiz{flex:1;display:flex;flex-direction:column}
.qhead{display:flex;align-items:center;gap:12px;padding-bottom:16px}
.progress{flex:1;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--ok);transition:width .35s;border-radius:99px}
.hearts{font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.qcard{padding:20px 18px}
.qkind{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.qtext{font-family:var(--display);font-size:28px;font-weight:600;line-height:1.2;margin:10px 0 4px;letter-spacing:-.01em;overflow-wrap:anywhere}
.qtext .gap{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--accent);margin:0 .1em}
.qsub{color:var(--muted);font-size:15px}
.pic{font-size:64px;line-height:1;margin:6px 0 4px}
.speak{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;margin-top:10px;display:inline-flex;gap:6px;align-items:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.opt{background:var(--surface);border:1.5px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:14px 10px;font-size:18px;font-weight:600;min-height:58px;overflow-wrap:anywhere}
.opt:active{transform:translateY(2px);border-bottom-width:2px}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
.opt[disabled]{cursor:default}
.typebox{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.typebox input{font:600 22px var(--body);padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);width:100%;box-sizing:border-box}
.typebox input.ok{border-color:var(--ok);background:var(--ok-soft)} .typebox input.bad{border-color:var(--bad);background:var(--bad-soft)}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.keys button{min-width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px;font-weight:600}
.clock{display:block;width:150px;height:150px;margin:8px auto 0}
.clock .face{fill:var(--surface);stroke:var(--ink);stroke-width:3}
.clock .tick{stroke:var(--muted);stroke-width:2}
.clock .h{stroke:var(--ink);stroke-width:6;stroke-linecap:round}
.clock .mn{stroke:var(--accent);stroke-width:4;stroke-linecap:round}
.clock text{font:700 13px var(--body);fill:var(--ink);text-anchor:middle;dominant-baseline:central}

.feedback{margin-top:auto;padding-top:16px}
.fb{border-radius:16px;padding:14px 16px;margin-bottom:12px}
.fb.ok{background:var(--ok-soft);color:var(--ok)} .fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb strong{display:block;font-size:17px;margin-bottom:2px}
.fb span{color:var(--ink);font-size:15px}
.btn{width:100%;border:0;border-radius:14px;padding:16px;font-size:17px;font-weight:700;background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 color-mix(in srgb, var(--accent) 60%, #000)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn[disabled]{opacity:.4;cursor:default}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);box-shadow:none;margin-top:10px}

/* Rezultāts */
.result{text-align:center;padding-top:30px;flex:1;display:flex;flex-direction:column}
.result .big{font-family:var(--display);font-size:64px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.result h2{font-size:26px;margin-top:4px}
.result p{color:var(--muted)}
.chips{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0}
.chips .stat{font-size:15px}
.mist{text-align:left;margin:8px 0 18px}
.mist li{padding:6px 0;border-bottom:1px solid var(--line)}
.mist ul{list-style:none;padding:0;margin:0}
.result .actions{margin-top:auto}
.foot{color:var(--muted);font-size:12px;text-align:center;margin-top:22px}
@keyframes pop{0%{transform:scale(.96);opacity:.5}100%{transform:none;opacity:1}}
.qcard{animation:pop .2s ease-out}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.shake{animation:shake .25s}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div class="app" id="app"></div>

<script>
/* ============ DATI ============ */
// Lietvārdi no plakātiem un A1 gramatikas: [celms, galotne, dzimte v/s, deklinācija, attēls, daudzskaitlis]
const NOUNS = [
 ['gald','s','v',1,'','galdi'],['krēsl','s','v',1,'🪑','krēsli'],['skap','is','v',2,'','skapji'],
 ['bumb','a','s',4,'🏀','bumbas'],['lell','e','s',5,'🪆','lelles'],['cilvēk','s','v',1,'🧍','cilvēki'],
 ['skolotāj','s','v',1,'🧑‍🏫','skolotāji'],['vīriet','is','v',2,'👨','vīrieši'],['laps','a','s',4,'🦊','lapsas'],
 ['vāver','e','s',5,'🐿️','vāveres'],['gov','s','s',6,'🐄','govis'],['snieg','s','v',1,'❄️',null],
 ['vēj','š','v',1,'🌬️','vēji'],['mākon','is','v',2,'☁️','mākoņi'],['liet','us','v',3,'🌧️',null],
 ['migl','a','s',4,'🌫️',null],['saul','e','s',5,'☀️',null],['pien','s','v',1,'🥛',null],
 ['med','us','v',3,'🍯',null],['tēj','a','s',4,'🍵','tējas'],['maiz','e','s',5,'🍞','maizes'],
 ['ābol','s','v',1,'🍎','āboli'],['kaķ','is','v',2,'🐈','kaķi'],['sun','s','v',1,'🐕','suņi'],
 ['ziv','s','s',6,'🐟','zivis'],['māj','a','s',4,'🏠','mājas'],['grāmat','a','s',4,'📖','grāmatas'],
 ['puķ','e','s',5,'🌷','puķes'],['zaķ','is','v',2,'🐇','zaķi'],['lāc','is','v',2,'🐻','lāči'],
 ['pel','e','s',5,'🐭','peles'],['ez','is','v',2,'🦔','eži'],['vilk','s','v',1,'🐺','vilki'],
 ['zirg','s','v',1,'🐎','zirgi'],['putn','s','v',1,'🐦','putni'],['kok','s','v',1,'🌳','koki'],
 ['plīt','s','s',6,'','plītis'],['brāl','is','v',2,'','brāļi'],['mās','a','s',4,'','māsas'],
 ['kaimiņ','š','v',1,'','kaimiņi'],['zirn','is','v',2,'','zirņi'],['kaz','a','s',4,'🐐','kazas'],
 ['zemen','e','s',5,'🍓','zemenes'],['burkān','s','v',1,'🥕','burkāni'],['pil','s','s',6,'🏰','pilis'],
 ['mašīn','a','s',4,'🚗','mašīnas'],['velosipēd','s','v',1,'🚲','velosipēdi'],['krekl','s','v',1,'👕','krekli'],
 ['kleit','a','s',4,'👗','kleitas'],['karot','e','s',5,'🥄','karotes'],['pulksten','is','v',2,'⏰','pulksteņi']
];
const word = n => n[0]+n[1];

// Vietas lokatīvam: [nominatīvs, lokatīvs]
const PLACES = [
 ['skola','skolā'],['veikals','veikalā'],['parks','parkā'],['mežs','mežā'],['birojs','birojā'],['teātris','teātrī'],
 ['māja','mājā'],['istaba','istabā'],['pilsēta','pilsētā'],['iela','ielā'],['Rīga','Rīgā'],['Latvija','Latvijā'],
 ['kafejnīca','kafejnīcā'],['virtuve','virtuvē'],['slimnīca','slimnīcā'],['bibliotēka','bibliotēkā'],['Liepāja','Liepājā'],
 ['Jūrmala','Jūrmalā'],['ezers','ezerā'],['dārzs','dārzā'],['viesnīca','viesnīcā'],['aptieka','aptiekā'],['stacija','stacijā'],
 ['jūra','jūrā'],['tirgus','tirgū'],['lauki','laukos'],['kalni','kalnos'],['meži','mežos'],['Alpi','Alpos'],
 ['veikali','veikalos'],['upes','upēs'],['pilsētas','pilsētās'],['kafejnīcas','kafejnīcās'],['Cēsis','Cēsīs']
];
const LOC_FRAMES = ['Es esmu ___.','Vakar mēs bijām ___.','Rīt viņi būs ___.','Kur tu esi? — Esmu ___.','Mana māsa strādā ___.'];

// Būt
const PERSONS = ['es','tu','viņš','viņa','mēs','jūs','viņi','viņas'];
const BUT = {
 es:['esmu','biju','būšu'], tu:['esi','biji','būsi'], 'viņš':['ir','bija','būs'], 'viņa':['ir','bija','būs'],
 'mēs':['esam','bijām','būsim'], 'jūs':['esat','bijāt','būsit'], 'viņi':['ir','bija','būs'], 'viņas':['ir','bija','būs']
};
const TENSE = [{w:'Tagad',n:'tagadne'},{w:'Vakar',n:'pagātne'},{w:'Rīt',n:'nākotne'}];
const BUT_PLACES = ['mājās','skolā','darbā','Rīgā','laukos','parkā','veikalā','kafejnīcā'];
const neg = (p,t)=> (t===0 && BUT[p][0]==='ir') ? 'nav' : 'ne'+BUT[p][t];

// Skaitļi
const UNITS=['nulle','viens','divi','trīs','četri','pieci','seši','septiņi','astoņi','deviņi'];
const TEENS=['desmit','vienpadsmit','divpadsmit','trīspadsmit','četrpadsmit','piecpadsmit','sešpadsmit','septiņpadsmit','astoņpadsmit','deviņpadsmit'];
const TENS=['','','divdesmit','trīsdesmit','četrdesmit','piecdesmit','sešdesmit','septiņdesmit','astoņdesmit','deviņdesmit'];
const num = n => n<10?UNITS[n]: n<20?TEENS[n-10]: TENS[Math.floor(n/10)]+(n%10?' '+UNITS[n%10]:'');

// Pulkstenis
const HN=['','viens','divi','trīs','četri','pieci','seši','septiņi','astoņi','deviņi','desmit','vienpadsmit','divpadsmit'];
const HL=['','vienos','divos','trijos','četros','piecos','sešos','septiņos','astoņos','deviņos','desmitos','vienpadsmitos','divpadsmitos'];
const nextH = h => h===12?1:h+1;
const EVENTS=['sākas filma','sākas darbs','ir pusdienas','sākas koncerts','atiet vilciens','ir tikšanās'];

/* ============ PALĪGI ============ */
const $ = s => document.querySelector(s);
const rnd = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const uniq = a => [...new Set(a)];
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'');
const norm = s => s.trim().toLowerCase().replace(/\s+/g,' ').replace(/[.!?]+$/,'');
function opts(correct, pool, n=4){ return shuffle(uniq([correct, ...shuffle(uniq(pool).filter(x=>x!==correct)).slice(0,n-1)])); }
const colorEnd = (stem,end,g) => esc(stem)+`<span class="${g==='v'?'m':'f'}">${esc(end)}</span>`;
const stemOf = w => w.replace(/(is|us|as|es|s|š|a|e|i)$/,'');

/* ============ SAGLABĀŠANA ============ */
const KEY='valodas-taka-v1';
let S = {xp:0, streak:0, lastDay:null, today:{day:null,xp:0}, mods:{}, weak:{}};
try{ const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S, JSON.parse(raw)); }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const dayStr = (d=new Date()) => d.toISOString().slice(0,10);
function touchDay(){
  const t=dayStr();
  if(S.today.day!==t) S.today={day:t,xp:0};
  if(S.lastDay!==t){
    const y=new Date(); y.setDate(y.getDate()-1);
    S.streak = (S.lastDay===dayStr(y)) ? S.streak+1 : 1;
    S.lastDay=t;
  }
}
const GOAL=50;
function weakKey(mod,id){return mod+'|'+id}
function pickItem(mod, items, idOf){
  // Biežāk izvēlas vārdus, kuros iepriekš kļūdījies (vienkārša atkārtošanas sistēma)
  const w = items.map(it => 1 + 3*(S.weak[weakKey(mod,idOf(it))]||0));
  let r = Math.random()*w.reduce((a,b)=>a+b,0);
  for(let i=0;i<items.length;i++){ r-=w[i]; if(r<=0) return items[i]; }
  return items[items.length-1];
}
function mark(mod,id,ok){
  const k=weakKey(mod,id), v=S.weak[k]||0;
  if(ok){ if(v>1) S.weak[k]=v-1; else delete S.weak[k]; } else S.weak[k]=Math.min(v+1,4);
}

/* ============ NODARBĪBAS ============ */
const MODULES = [
{ id:'but', glyph:'esmu', ch:'1. nodaļa', title:'Darbības vārds „būt”', desc:'es esmu, es biju, es būšu',
  theory:()=>`
  <p class="lead">„Būt” ir svarīgākais darbības vārds. Ar to saka, kur, kas vai kāds kāds ir.</p>
  <div class="card"><h4>Tagadne · pagātne · nākotne</h4><div class="tbl-wrap"><table>
  <tr><th></th><th>tagad</th><th>vakar</th><th>rīt</th></tr>
  ${['es','tu','viņš, viņa','mēs','jūs','viņi, viņas'].map(p=>{const k=p.split(',')[0];return `<tr><td><b>${p}</b></td><td>${BUT[k][0]}</td><td>${BUT[k][1]}</td><td>${BUT[k][2]}${k==='jūs'?' / būsiet':''}</td></tr>`}).join('')}
  </table></div></div>
  <div class="card"><h4>Noliegums</h4><p>Priekšā pievieno <b>ne-</b>: neesmu, nebiju, nebūšu.</p>

/* ============ RUNA ============ */
let lvVoice=null;
function findVoice(){ try{ const v=speechSynthesis.getVoices(); lvVoice=v.find(x=>/^lv/i.test(x.lang))||null; }catch(e){} }
try{ findVoice(); speechSynthesis.onvoiceschanged=()=>{findVoice(); if(view==='quiz') renderQuiz();}; }catch(e){}
function speak(t){ try{ if(!lvVoice) return; const u=new SpeechSynthesisUtterance(t); u.voice=lvVoice; u.lang=lvVoice.lang; u.rate=.9; speechSynthesis.cancel(); speechSynthesis.speak(u);}catch(e){} }

/* ============ SKATI ============ */
const app=$('#app');
let view='home', cur=null, Q=null;
const ICON_FIRE='<svg viewBox="0 0 24 24" fill="var(--accent)"><path d="M12 2c1 4 5 5.5 5 11a5 5 0 0 1-10 0c0-2.5 1.2-4 2.5-5 .2 1.8 1 3 2.5 3.5C11 9 11 5.5 12 2z"/></svg>';
const ICON_STAR='<svg viewBox="0 0 24 24" fill="var(--ok)"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7.1L12 17.3 5.8 21l1.6-7.1L2 9.2l7.1-.6z"/></svg>';
function topbar(back){
  touchDayView();
  return `<div class="top">${back?`<button class="back" data-act="home" aria-label="Atpakaļ">‹ Atpakaļ</button><div style="flex:1"></div>`:`<div class="brand"><span class="flag"></span>Valodas Taka</div>`}
  <div class="stat" title="Dienu sērija">${ICON_FIRE}${S.streak||0}</div><div class="stat" title="Punkti">${ICON_STAR}${S.xp}</div></div>`;
}
function touchDayView(){ const t=dayStr(); if(S.today.day!==t) S.today={day:t,xp:0}; }
function ring(p){ const r=15,c=2*Math.PI*r; return `<svg class="ring" viewBox="0 0 38 38" aria-label="${Math.round(p*100)}%"><circle class="t" cx="19" cy="19" r="${r}"/><circle class="v" cx="19" cy="19" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}" transform="rotate(-90 19 19)"/><text x="19" y="19" text-anchor="middle" dominant-baseline="central">${Math.round(p*100)}</text></svg>`; }
function modProgress(id){ const m=S.mods[id]; return m?Math.min(1,(m.best||0)/10*Math.min(1,(m.rounds||0)/3)):0; }

function renderHome(){
  view='home';
  const weakCount=Object.keys(S.weak).length;
  const h=new Date().getHours(), greet=h<11?'Labrīt!':h<18?'Labdien!':'Labvakar!';
  app.innerHTML = topbar(false)+`
  <div class="hello"><h1>${greet}</h1><p>Mazi soļi katru dienu. Izvēlies tēmu un sāc.</p>
   <div class="goal"><b style="font-size:14px">Dienas mērķis</b><div class="bar"><i style="width:${Math.min(100,S.today.xp/GOAL*100)}%"></i></div><small>${S.today.xp}/${GOAL}</small></div></div>
  <button class="review" data-act="review" ${weakCount?'':'disabled'}>Atkārtot kļūdas${weakCount?` (${weakCount})`:' — vēl nav kļūdu'}</button>
  <div class="section-label">A1 gramatika</div>
  <div class="modules">${MODULES.map(m=>`
    <button class="mod" data-mod="${m.id}"><span class="glyph">${m.glyph}</span>
    <span><span class="ch">${m.ch}</span><h3>${m.title}</h3><p>${m.desc}</p></span>${ring(modProgress(m.id))}</button>`).join('')}
  </div>
  <p class="foot">Progress glabājas šajā ierīcē.${lvVoice?'':' Latviešu balss šajā ierīcē nav atrasta.'}</p>`;
}

function renderTheory(m){
  view='theory'; cur=m;
  app.innerHTML = topbar(true)+`<div class="theory"><div class="ch" style="font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px">${m.ch}</div>
  <h2>${m.title}</h2>${m.theory()}</div>
  <div class="sticky-cta"><button class="btn" data-act="start">Sākt treniņu · 10 jautājumi</button></div>`;
  app.scrollTop=0; window.scrollTo(0,0);
}

function startRound(mods){
  const qs=[];
  for(let i=0;i<10;i++){
    const m=Array.isArray(mods)?rnd(mods):mods;
    let it;
    if(m.review){ it=m.review(); } else it=pickItem(m.id, m.items(), m.itemId);
    const q=m.make(it); q.mod=m.id; q.itemId=m.itemId(it); qs.push(q);
  }
  Q={mods, qs, i:0, correct:0, mistakes:[], answered:false, xp:0};
  view='quiz'; renderQuiz();
}
// Atkārtošanas režīms: ņem tikai vārdus ar kļūdām
function reviewRound(){
  const keys=Object.keys(S.weak); if(!keys.length) return;
  const qs=[];
  for(let i=0;i<10;i++){
    const [mid,id]=rnd(keys).split('|'); const m=MODULES.find(x=>x.id===mid); if(!m) continue;
    const it=m.items().find(x=>String(m.itemId(x))===id); if(!it) continue;
    const q=m.make(it); q.mod=m.id; q.itemId=id; qs.push(q);
  }
  if(!qs.length) return;
  Q={mods:null, review:true, qs, i:0, correct:0, mistakes:[], answered:false, xp:0};
  view='quiz'; renderQuiz();
}

function clockSVG(h,m){
  const ha=((h%12)+m/60)*30, ma=m*6, R=60;
  const ticks=Array.from({length:12},(_,i)=>{const a=i*30*Math.PI/180;return `<text x="${75+R*.78*Math.sin(a)}" y="${75-R*.78*Math.cos(a)}">${i||12}</text>`}).join('');
  return `<svg class="clock" viewBox="0 0 150 150" role="img" aria-label="Pulkstenis"><circle class="face" cx="75" cy="75" r="${R+8}"/>${ticks}
  <line class="h" x1="75" y1="75" x2="${75+32*Math.sin(ha*Math.PI/180)}" y2="${75-32*Math.cos(ha*Math.PI/180)}"/>
  <line class="mn" x1="75" y1="75" x2="${75+50*Math.sin(ma*Math.PI/180)}" y2="${75-50*Math.cos(ma*Math.PI/180)}"/>
  <circle cx="75" cy="75" r="4" fill="var(--ink)"/></svg>`;
}

const LV_KEYS=['ā','č','ē','ģ','ī','ķ','ļ','ņ','š','ū','ž'];
function renderQuiz(){
  const q=Q.qs[Q.i], n=Q.qs.length;
  app.innerHTML = `
  <div class="qhead"><button class="back" data-act="home" aria-label="Beigt">✕</button>
   <div class="progress"><i style="width:${Q.i/n*100}%"></i></div><span class="hearts">${Q.i+1}/${n}</span></div>
  <div class="quiz">
   <div class="card qcard">
    <div class="qkind">${q.kind}</div>
    ${q.pic?`<div class="pic" style="${q.big?'font-size:96px;text-align:center;margin:14px 0':''}">${q.pic}</div>`:''}
    ${q.clock?clockSVG(q.clock.h,q.clock.m):''}
    ${q.html?`<div class="qtext">${q.html}</div>`:''}
    ${q.sub?`<div class="qsub">${q.sub}</div>`:''}
    ${lvVoice&&q.say?`<button class="speak" data-act="say">🔊 Klausīties</button>`:''}
   </div>
   ${q.type==='choice'
     ? `<div class="opts">${q.options.map((o,i)=>`<button class="opt" data-opt="${i}">${esc(o)}</button>`).join('')}</div>`
     : `<form class="typebox" id="tf"><input id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" ${q.numeric?'inputmode="numeric"':''} placeholder="Tava atbilde">
        ${q.numeric?'':`<div class="keys">${LV_KEYS.map(k=>`<button type="button" data-key="${k}">${k}</button>`).join('')}</div>`}
        <button class="btn" id="check" type="submit">Pārbaudīt</button></form>`}
   <div class="feedback" id="fb"></div>
  </div>`;
  if(q.type!=='choice'){ const inp=$('#ans'); setTimeout(()=>{ try{inp.focus({preventScroll:true});}catch(e){} },50); }
}

function answer(given){
  if(Q.answered) return; Q.answered=true;
  const q=Q.qs[Q.i];
  const okList=[q.answer, ...(q.accept||[])].map(norm);
  const g=norm(given);
  const ok = okList.includes(g);
  const almost = !ok && okList.some(a=>strip(a)===strip(g));
  if(q.type==='choice'){
    document.querySelectorAll('.opt').forEach(b=>{ b.disabled=true; const t=q.options[+b.dataset.opt];
      if(norm(t)===norm(q.answer)) b.classList.add('ok'); else if(t===given) b.classList.add('bad'); });
  } else {
    const inp=$('#ans'); inp.readOnly=true; inp.classList.add(ok?'ok':'bad'); $('#check').remove();
    const k=document.querySelector('.keys'); if(k) k.remove();
  }
  mark(q.mod,q.itemId,ok);
  touchDay();
  if(ok){ Q.correct++; Q.xp+=10; S.xp+=10; S.today.xp+=10; }
  else { Q.mistakes.push(q); const c=document.querySelector('.qcard'); c.classList.add('shake'); }
  save();
  const praise=rnd(['Pareizi!','Lieliski!','Malacis!','Tieši tā!','Super!']);
  $('#fb').innerHTML = `<div class="fb ${ok?'ok':'bad'}"><strong>${ok?praise:(almost?'Gandrīz! Pievērs uzmanību garumzīmēm un mīkstinājuma zīmēm.':'Nepareizi')}</strong>
   <span>${ok?'':'Pareizi: <b>'+esc(q.answer)+'</b> · '}${q.explain}</span></div>
   <button class="btn" data-act="next" id="next">${Q.i+1<Q.qs.length?'Tālāk':'Rezultāts'}</button>`;
  if(ok && q.say) speak(q.say);
  setTimeout(()=>{ try{const nx=$('#next'); if(nx) nx.focus({preventScroll:true});}catch(e){} const f=$('#fb'); if(f) f.scrollIntoView({behavior:'smooth',block:'end'}); },30);
}

function next(){
  Q.i++; Q.answered=false;
  if(Q.i<Q.qs.length) return renderQuiz();
  // Rezultāts
  if(!Q.review && !Array.isArray(Q.mods)){
    const m=S.mods[Q.mods.id]||{best:0,rounds:0};
    m.best=Math.max(m.best,Q.correct); m.rounds++; S.mods[Q.mods.id]=m;
  }
  if(Q.correct===Q.qs.length){ S.xp+=20; S.today.xp+=20; Q.xp+=20; }
  save();
  view='result';
  const pct=Q.correct/Q.qs.length;
  const title = pct===1?'Bez kļūdām!':pct>=.8?'Ļoti labi!':pct>=.5?'Labs darbs!':'Turpini trenēties!';
  app.innerHTML = topbar(false)+`<div class="result">
   <div class="big">${Q.correct}/${Q.qs.length}</div><h2>${title}</h2>
   <div class="chips"><div class="stat">${ICON_STAR}+${Q.xp} punkti</div><div class="stat">${ICON_FIRE}${S.streak} ${S.streak===1?'diena':'dienas'} pēc kārtas</div></div>
   ${Q.mistakes.length?`<div class="card mist"><h4 style="margin:0 0 6px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)">Ko atkārtot</h4><ul>${Q.mistakes.map(q=>`<li>${q.explain}</li>`).join('')}</ul></div>`:''}
   <div class="actions"><button class="btn" data-act="again">Vēl viens treniņš</button><button class="btn ghost" data-act="home">Uz sākumu</button></div></div>`;
}

/* ============ NOTIKUMI ============ */
app.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t) return;
  if(t.dataset.mod){ renderTheory(MODULES.find(m=>m.id===t.dataset.mod)); return; }
  if(t.dataset.opt!==undefined){ answer(Q.qs[Q.i].options[+t.dataset.opt]); return; }
  if(t.dataset.key){ const i=$('#ans'); const s=i.selectionStart??i.value.length, en=i.selectionEnd??s; i.value=i.value.slice(0,s)+t.dataset.key+i.value.slice(en); i.focus(); i.setSelectionRange(s+1,s+1); return; }
  const a=t.dataset.act;
  if(a==='home') renderHome();
  else if(a==='start') startRound(cur);
  else if(a==='again'){ if(Q.review) reviewRound(); else startRound(Q.mods); }
  else if(a==='review') reviewRound();
  else if(a==='next') next();
  else if(a==='say') speak(Q.qs[Q.i].say);
});
app.addEventListener('submit',e=>{ e.preventDefault(); const v=$('#ans').value; if(!v.trim()) return; answer(v); });
document.addEventListener('keydown',e=>{
  if(view!=='quiz') return;
  if(Q.answered && e.key==='Enter'){ e.preventDefault(); next(); return; }
  if(!Q.answered && Q.qs[Q.i].type==='choice' && /^[1-4]$/.test(e.key)){ const o=Q.qs[Q.i].options[+e.key-1]; if(o) answer(o); }
});
renderHome();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>
